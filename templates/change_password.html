<!DOCTYPE html>
<html>

<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

    <title>Change Password</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#121212;
            color:white;
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:340px;
            background:#1e1e1e;
            padding:25px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.5);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            box-sizing:border-box;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            background:#2a2a2a;
            color:white;
            outline:none;
            font-size:15px;
        }

        input:focus{
            border:1px solid #4caf50;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#4caf50;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#43a047;
        }

        .flash{
            background:#333;
            color:#ffd54f;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }

        .back-btn{
            display:block;
            margin-top:18px;
            text-align:center;
            text-decoration:none;
            color:#64b5f6;
            font-weight:bold;
        }

        .back-btn:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>🔒 Change Password</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="password"
            name="current_password"
            placeholder="Current Password"
            required
        >

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required
        >

        <button type="submit">
            Change Password
        </button>

    </form>

<a href="/profile" class="back-btn">
    ← Back to Profile
</a>

</div>

</body>

</html>
