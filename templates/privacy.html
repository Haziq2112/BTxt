<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>BTxt Privacy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --void:#0A0E0F;
    --panel:#14181A;
    --panel-2:#1B2023;
    --signal:#00E676;
    --signal-dim:#00E67633;
    --paper:#F5F7F6;
    --slate:#8A9296;
    --coral:#FF5D5D;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
}

body{
    background:var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100dvh;
    padding-bottom:110px;
}

a{
    text-decoration:none;
    color:inherit;
}

.header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    border-bottom:1px solid #1D2225;
}

.header-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
}

.flash{
    margin:16px 20px 0;
    padding:12px 14px;
    background:var(--panel-2);
    border-left:3px solid var(--signal);
    border-radius:8px;
    font-size:14px;
}

.list-title{
    padding:22px 20px 8px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--slate);
    font-weight:600;
}

.card{
    margin:0 16px;
    background:var(--panel);
    border-radius:16px;
    overflow:hidden;
    border:1px solid #1D2225;
}

.item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px;
    border-bottom:1px solid #1D2225;
}

.item:last-child{
    border-bottom:none;
}

.item-text{
    flex:1;
}

.item-title{
    font-size:16px;
}

.item-sub{
    font-size:12.5px;
    color:var(--slate);
    margin-top:2px;
}

.item.disabled{
    opacity:.5;
}

.item.disabled .item-title,
.item.disabled .item-sub{
    color:var(--slate);
}

/* ---------- TOGGLE SWITCH ---------- */

.switch{
    position:relative;
    width:46px;
    height:26px;
    flex-shrink:0;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.switch-track{
    position:absolute;
    inset:0;
    background:#2A2F32;
    border-radius:26px;
    transition:background .15s ease;
    cursor:pointer;
}

.switch-track::before{
    content:"";
    position:absolute;
    height:20px;
    width:20px;
    left:3px;
    bottom:3px;
    background:var(--paper);
    border-radius:50%;
    transition:transform .15s ease;
}

.switch input:checked + .switch-track{
    background:var(--signal);
}

.switch input:checked + .switch-track::before{
    transform:translateX(20px);
}

.back-wrap{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--void) 60%, transparent);
}

.back{
    width:100%;
    display:block;
    text-align:center;
    padding:16px;
    border-radius:14px;
    background:var(--panel);
    border:1.5px solid #262B2E;
    color:var(--paper);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.back:active{
    background:var(--panel-2);
}

</style>
</head>

<body>

<div class="header">
    <div class="header-title">🔒 Privacy</div>
</div>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST" action="/privacy" id="privacyForm">

<div class="list-title">Visibility</div>

<div class="card">

    <label class="item" for="show_online">
        <div class="item-text">
            <div class="item-title">Online Status</div>
            <div class="item-sub">Let others see when you're online</div>
        </div>
        <div class="switch">
            <input type="checkbox" id="show_online" name="show_online" {% if show_online %}checked{% endif %} onchange="privacyForm.submit()">
            <label class="switch-track" for="show_online"></label>
        </div>
    </label>

    <label class="item" for="show_last_seen">
        <div class="item-text">
            <div class="item-title">Last Seen</div>
            <div class="item-sub">Let others see when you were last active</div>
        </div>
        <div class="switch">
            <input type="checkbox" id="show_last_seen" name="show_last_seen" {% if show_last_seen %}checked{% endif %} onchange="privacyForm.submit()">
            <label class="switch-track" for="show_last_seen"></label>
        </div>
    </label>

</div>

</form>

<div class="list-title">More</div>

<div class="card">

    <div class="item disabled">
        <div class="item-text">
            <div class="item-title">Read Receipts</div>
            <div class="item-sub">Coming soon</div>
        </div>
    </div>

    <div class="item disabled">
        <div class="item-text">
            <div class="item-title">Blocked Users</div>
            <div class="item-sub">Coming soon</div>
        </div>
    </div>

</div>

<div class="back-wrap">
    <a href="/settings">
        <button class="back" type="button">← Back</button>
    </a>
</div>

</body>
</html>
