<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Deleted Accounts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --void:#0A0E0F;
    --panel:#14181A;
    --panel-2:#1B2023;
    --signal:#00E676;
    --paper:#F5F7F6;
    --slate:#8A9296;
    --coral:#FF5D5D;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    margin:0;
    padding:0 0 40px;
}

.page-header{
    padding:calc(env(safe-area-inset-top) + 20px) 20px 16px;
    border-bottom:1px solid #1D2225;
    margin-bottom:10px;
    text-align:center;
}

h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 8px;
}

.back-link{
    color:var(--slate);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.card{
    background:var(--panel);
    border:1px solid #1D2225;
    padding:20px;
    margin:14px 16px;
    border-radius:18px;
}

.card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    margin:0 0 6px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    color:var(--void);
    cursor:pointer;
    margin-right:10px;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
}

.restore{
    background:var(--signal);
}

.delete{
    background:var(--coral);
}

a{
    color:inherit;
    text-decoration:none;
}

.empty{
    text-align:center;
    color:var(--slate);
    padding:60px 24px;
    font-size:15px;
}

@keyframes popup{
    from{ transform:scale(.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

#deleteForeverPopup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
    justify-content:center;
    align-items:center;
    z-index:9999;
    backdrop-filter:blur(3px);
}

#deleteForeverPopup > div{
    background:var(--panel);
    border:1px solid #262B2E;
    width:340px;
    max-width:90%;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    animation:popup .18s ease;
}

#deleteForeverPopup h2{
    margin:0 0 18px;
    font-family:'Space Grotesk',sans-serif;
    color:var(--paper);
    font-size:20px;
    font-weight:700;
}

#deleteForeverText{
    color:var(--slate);
    line-height:1.5;
    margin-bottom:26px;
    font-size:15px;
}

.popup-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.popup-actions button{
    margin-right:0;
}

.btn-neutral{
    background:var(--panel-2);
    color:var(--paper);
    border:1px solid #262B2E;
}

.btn-danger{
    background:var(--coral);
}

</style>

</head>

<body>

<div class="page-header">
    <h1>🗂 Deleted Accounts</h1>
    <a href="/admin" class="back-link">← Back to Admin</a>
</div>

<div id="deleted-list">
    {% include "deleted_accounts_list.html" %}
</div>

<div id="deleteForeverPopup">

<div>

<h2>Delete Forever?</h2>

<p id="deleteForeverText"></p>

<div class="popup-actions">

<button
onclick="closeDeletePopup()"
class="btn-neutral">
Cancel
</button>

<button
onclick="confirmDeleteForever()"
class="btn-danger">
Delete
</button>

</div>

</div>

</div>

<script src="/static/js/deleted.js"></script>

</body>

</html>
