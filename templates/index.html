<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<meta http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
content="no-cache">

<meta http-equiv="Expires"
content="0">

<title>BTxt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --void:#0A0E0F;
    --panel:#14181A;
    --panel-2:#1B2023;
    --signal:#00E676;
    --signal-dim:#00E67633;
    --paper:#F5F7F6;
    --slate:#8A9296;
    --coral:#FF5D5D;
    --me-bubble:#123B2B;
    --other-bubble:#1B2023;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--void);
    color:var(--paper);
    font-size:16px;
    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:calc(68px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    background:var(--void);
    display:flex;
    align-items:center;
    padding-left:12px;
    padding-right:12px;
    border-bottom:1px solid #1D2225;
    z-index:1000;
}

.back{
    text-decoration:none;
    color:var(--paper);
    font-size:24px;
    margin-right:12px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    border:1.5px solid var(--signal);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    margin-left:12px;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.username{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-btn{
    margin-left:auto;
    background:none;
    border:none;
    color:var(--paper);
    font-size:19px;
    cursor:pointer;
    padding:8px;
    flex-shrink:0;
}

.search-bar{
    display:none;
    position:fixed;
    top:calc(68px + env(safe-area-inset-top));
    left:0;
    right:0;
    background:var(--panel);
    border-bottom:1px solid #262B2E;
    padding:10px 12px;
    z-index:900;
    gap:8px;
    align-items:center;
}

.search-bar.show{
    display:flex;
}

.search-bar input{
    flex:1;
    padding:10px 14px;
    border-radius:20px;
    border:1.5px solid #262B2E;
    background:var(--panel-2);
    color:var(--paper);
    font-size:15px;
    outline:none;
}

.search-bar input:focus{
    border-color:var(--signal);
}

.search-bar button{
    background:none;
    border:none;
    color:var(--slate);
    font-size:18px;
    cursor:pointer;
}

.bubble.search-hidden{
    display:none;
}

.bubble.search-match{
    outline:2px solid var(--signal);
}

.pinned-bar{
    display:none;
    position:fixed;
    top:calc(68px + env(safe-area-inset-top));
    left:0;
    right:0;
    background:var(--panel);
    border-bottom:1px solid #262B2E;
    padding:8px 14px;
    z-index:800;
    align-items:center;
    gap:8px;
    font-size:13px;
    cursor:pointer;
}

.pinned-bar.show{
    display:flex;
}

.pinned-text{
    color:var(--slate);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ---------- SELECTION MODE HEADER ---------- */
/* Sits at the exact same position as .header, but on top of it —
   so entering selection mode replaces the back button, avatar,
   name, status, and search icon with Cancel / count / Copy / Delete,
   instead of leaving the search bar visible underneath. */

.selection-header{
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:calc(68px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    background:var(--panel);
    align-items:center;
    padding-left:16px;
    padding-right:16px;
    border-bottom:1px solid #262B2E;
    z-index:1100;
}

.selection-header.show{
    display:flex;
}

.sel-cancel{
    background:none;
    border:none;
    color:var(--paper);
    font-size:22px;
    cursor:pointer;
    padding:6px;
}

#selectionCount{
    margin-left:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
}

.sel-actions{
    margin-left:auto;
    display:flex;
    gap:20px;
}

.sel-actions button{
    background:none;
    border:none;
    color:var(--paper);
    font-size:21px;
    cursor:pointer;
    padding:6px;
}

.sel-actions .sel-delete{
    color:var(--coral);
}

/* ---------- REACTIONS ---------- */

.reaction-chips{
    display:flex;
    gap:4px;
    margin-top:4px;
    flex-wrap:wrap;
}

.reaction-chip{
    background:rgba(255,255,255,.1);
    border-radius:10px;
    padding:2px 7px;
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:3px;
}

.reaction-chip.mine{
    background:var(--signal-dim);
    border:1px solid var(--signal);
}

.pin-icon{
    font-size:11px;
}

.popup-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.popup-overlay.show{
    display:flex;
}

/* ---------- FORWARD ---------- */

.forward-card{
    background:var(--panel);
    border:1px solid #262B2E;
    border-radius:18px;
    padding:20px;
    width:300px;
    max-width:88vw;
    max-height:70vh;
    overflow-y:auto;
}

.forward-card h3{
    font-family:'Space Grotesk',sans-serif;
    margin-bottom:14px;
}

.forward-list button{
    width:100%;
    text-align:left;
    padding:12px;
    background:var(--panel-2);
    border:none;
    border-radius:10px;
    color:var(--paper);
    font-size:15px;
    margin-bottom:8px;
    cursor:pointer;
}

.forward-list button:active{
    background:#242A2D;
}

/* ---------- SELECTION MODE (bubble state) ---------- */

.bubble.selected{
    outline:2px solid var(--signal);
}

.status{
    margin-top:2px;
    font-size:12px;
    color:var(--slate);
}

.typing-text{
    color:var(--signal);
    font-style:italic;
}

/* =========================
CHAT AREA
========================= */

#chat-box{
    position:fixed;
    top:calc(68px + env(safe-area-inset-top));
    bottom:92px;
    left:0;
    right:0;
    overflow-y:auto;
    padding:16px 14px;
    -webkit-user-select:none;
    user-select:none;
}

/* =========================
MESSAGE BUBBLES
========================= */

.bubble{
    max-width:76%;
    padding:11px 15px;
    margin:8px 0;
    border-radius:18px;
    font-size:15.5px;
    line-height:1.45;
    word-wrap:break-word;
    overflow-wrap:break-word;
    animation:fadeIn .18s ease;

    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;

    position:relative;
    touch-action:pan-y;
    transition:transform .2s ease;
    --swipe-progress:0;
}

.bubble::before{
    content:"↩";
    position:absolute;
    left:-30px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    color:var(--signal);
    opacity:var(--swipe-progress);
    transition:opacity .1s ease;
}

.bubble.highlight{
    animation:highlightFlash 1.2s ease;
}

@keyframes highlightFlash{
    0%{ box-shadow:0 0 0 2px var(--signal); }
    70%{ box-shadow:0 0 0 2px var(--signal); }
    100%{ box-shadow:0 0 0 0 transparent; }
}

.me{
    margin-left:auto;
    background:var(--me-bubble);
    border-bottom-right-radius:4px;
}

.other{
    margin-right:auto;
    background:var(--other-bubble);
    border-bottom-left-radius:4px;
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
}

.reply-box{
    background:rgba(255,255,255,.06);
    border-left:3px solid var(--signal);
    padding:8px 10px;
    border-radius:10px;
    margin-bottom:8px;
    font-size:13px;
}

.msg-time{
    margin-top:5px;
    font-size:11px;
    text-align:right;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
}

.time-text{
    opacity:.6;
}

.ticks{
    font-size:12px;
    opacity:.6;
    color:var(--paper);
}

.ticks.seen{
    opacity:1;
    color:var(--signal);
}

/* =========================
INPUT BAR
========================= */

#chat-form{
    position:fixed;
    left:0;
    right:0;
    bottom:calc(14px + env(safe-area-inset-bottom));
    padding:0 12px;
}

#replyPreview{
    background:var(--panel);
    border:1px solid #262B2E;
    padding:10px 12px;
    border-radius:14px;
    margin-bottom:8px;

    transform:translateX(-120%);
    opacity:0;
    transition:transform .28s ease, opacity .28s ease;

    display:block;
    pointer-events:none;
}

#replyPreview.show{
    transform:translateX(0);
    opacity:1;
    pointer-events:auto;
}

#replyTitle{
    font-weight:600;
    color:var(--signal);
    margin-bottom:3px;
    font-size:13px;
}

#replyText{
    font-size:14px;
    color:var(--slate);
}

/* =========================
MESSAGE INPUT
========================= */

#msg-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.attach-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--panel);
    border:1px solid #262B2E;
    color:var(--paper);
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

#message{
    flex:1;
    height:46px;
    max-height:120px;
    padding:12px 18px;
    border:1.5px solid #262B2E;
    outline:none;
    resize:none;
    border-radius:23px;
    background:var(--panel);
    color:var(--paper);
    font-size:16px;
}

#message:focus{
    border-color:var(--signal);
}

#message::placeholder{
    color:var(--slate);
}

.send-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:var(--signal);
    color:var(--void);
    font-size:19px;
    cursor:pointer;
    flex-shrink:0;
}

.send-btn:active{
    opacity:.85;
}

/* =========================
SCROLL BUTTON
========================= */

#scrollBtn{
    position:fixed;
    right:16px;
    bottom:100px;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:var(--panel);
    border:1px solid #262B2E;
    color:var(--paper);
    font-size:19px;
    display:none;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
}

/* =========================
LONG PRESS MENU
========================= */

#msgMenu{
    position:fixed;
    display:none;
    flex-direction:column;
    background:var(--panel);
    border:1px solid #262B2E;
    border-radius:16px;
    padding:8px 6px;
    min-width:190px;
    max-width:240px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    z-index:9999;
}

.reaction-row{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:2px 2px 8px;
}

.reaction-row button{
    background:none;
    border:none;
    font-size:23px;
    cursor:pointer;
    padding:4px 6px;
    border-radius:8px;
    transition:transform .1s ease, background .1s ease;
}

.reaction-row button:active{
    transform:scale(1.25);
    background:var(--panel-2);
}

.add-emoji-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1.5px solid var(--signal) !important;
    color:var(--signal) !important;
    font-size:18px !important;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 !important;
}

#customEmojiInput{
    display:none;
    width:100%;
    margin-bottom:8px;
    padding:8px;
    border-radius:10px;
    border:1.5px solid var(--signal);
    background:var(--panel-2);
    color:var(--paper);
    text-align:center;
    font-size:20px;
    outline:none;
}

.menu-divider{
    height:1px;
    background:#262B2E;
    margin:2px 4px 6px;
}

#msgMenu button{
    background:none;
    border:none;
    color:var(--paper);
    padding:11px 10px;
    font-size:15px;
    text-align:left;
    cursor:pointer;
    border-radius:10px;
    font-family:'Inter',sans-serif;
}

#msgMenu button:active{
    background:var(--panel-2);
}

#msgMenu button:last-child{
    color:var(--coral);
}

/* =========================
EDIT MODAL
========================= */

#editModal{
    display:none;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--panel);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    border-top-left-radius:22px;
    border-top-right-radius:22px;
    border-top:1px solid #262B2E;
    z-index:10000;
}

#editModal h3{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
}

#editInput{
    width:100%;
    height:90px;
    background:var(--panel-2);
    border:1.5px solid #262B2E;
    outline:none;
    resize:none;
    border-radius:14px;
    padding:12px;
    color:var(--paper);
    font-size:16px;
    margin-top:12px;
    font-family:'Inter',sans-serif;
}

#editInput:focus{
    border-color:var(--signal);
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:15px;
}

.modal-buttons button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
}

.cancel-btn{
    background:var(--panel-2);
    color:var(--paper);
    border:1px solid #262B2E;
}

.save-btn{
    background:var(--signal);
    color:var(--void);
}

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-thumb{
    background:#2A2F32;
    border-radius:20px;
}

</style>

</head>

📋 Copy
</button>

<button id="pinBtn" onclick="togglePinSelected()">
📌 Pin
</button>

<button onclick="openForwardPicker()">
↪ Forward
</button>

<button onclick="startSelectionMode()">
☑ Select
</button>

<button id="editBtn" onclick="editMessage()">
✏ Edit
</button>

<button id="deleteBtn" onclick="deleteMessage()">
🗑 Delete
</button>

<button id="deleteMeBtn" onclick="deleteForMe()">
🚫 Delete For Me
</button>

</div>

<div id="editModal">

<h3>Edit Message</h3>

<textarea id="editInput"></textarea>

<div class="modal-buttons">

<button
type="button"
class="cancel-btn"
onclick="closeEditModal()">

Cancel

</button>

<button
type="button"
class="save-btn"
onclick="saveEditMessage()">

Save

</button>

</div>

</div>

<!-- FORWARD PICKER -->
<div id="forwardPicker" class="popup-overlay">
    <div class="forward-card">
