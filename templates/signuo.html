<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>BText Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --void:#0A0E0F;
    --panel:#14181A;
    --panel-2:#1B2023;
    --signal:#00E676;
    --signal-dim:#00E67633;
    --paper:#F5F7F6;
    --slate:#8A9296;
    --coral:#FF5D5D;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    height:100%;
}

body{
    background:var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
}

/* ---------- HERO / SIGNAL MOTIF ---------- */

.hero{
    flex:0.85;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:32px 24px 16px;
    min-height:26vh;
}

.pulse-wrap{
    position:relative;
    width:92px;
    height:92px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
}

.pulse-ring{
    position:absolute;
    border:1.5px solid var(--signal);
    border-radius:50%;
    opacity:0;
    animation:pulse 2.6s ease-out infinite;
}

.pulse-ring.r1{ width:92px; height:92px; animation-delay:0s; }
.pulse-ring.r2{ width:92px; height:92px; animation-delay:.8s; }
.pulse-ring.r3{ width:92px; height:92px; animation-delay:1.6s; }

@keyframes pulse{
    0%{ transform:scale(.45); opacity:.7; }
    100%{ transform:scale(1); opacity:0; }
}

.mark{
    position:relative;
    width:52px;
    height:52px;
    border-radius:16px;
    background:var(--signal);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--void);
    box-shadow:0 0 32px var(--signal-dim);
}

.wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(24px,6vw,28px);
    letter-spacing:-0.02em;
}

.wordmark span{
    color:var(--signal);
}

.tagline{
    margin-top:6px;
    font-size:13px;
    color:var(--slate);
}

@media (prefers-reduced-motion: reduce){
    .pulse-ring{ animation:none; opacity:0; }
}

/* ---------- FORM SHEET ---------- */

.sheet{
    background:var(--panel);
    border-top-left-radius:28px;
    border-top-right-radius:28px;
    padding:30px 24px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    flex:1;
}

h1.title{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0 0 18px;
}

.field-label{
    font-size:13px;
    color:var(--slate);
    margin:14px 2px 6px;
    font-weight:500;
}

.field-label:first-of-type{
    margin-top:0;
}

input{
    width:100%;
    padding:16px 16px;
    border:1.5px solid #262B2E;
    border-radius:14px;
    background:var(--panel-2);
    color:var(--paper);
    font-size:16px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .15s ease;
}

input:focus{
    border-color:var(--signal);
}

.status-text{
    font-size:13px;
    margin:6px 2px 0;
    min-height:16px;
}

.error-text{
    color:var(--coral);
    font-size:13px;
    margin:6px 2px 0;
    min-height:16px;
}

button{
    width:100%;
    padding:17px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
}

#signupBtn{
    margin-top:22px;
    background:var(--signal);
    color:var(--void);
    transition:opacity .15s ease, transform .1s ease;
}

#signupBtn:active{
    transform:scale(.98);
}

#signupBtn:disabled{
    background:#2A2F32;
    color:var(--slate);
    cursor:not-allowed;
}

.back{
    margin-top:14px;
}

.back button{
    background:transparent;
    color:var(--paper);
    border:1.5px solid #2A2F32;
}

.back button:active{
    background:var(--panel-2);
}

</style>
</head>

<body>

<div class="hero">

    <div class="pulse-wrap">
        <div class="pulse-ring r1"></div>
        <div class="pulse-ring r2"></div>
        <div class="pulse-ring r3"></div>
        <div class="mark">B</div>
    </div>

    <div class="wordmark">B<span>Text</span></div>
    <div class="tagline">Create your account</div>

</div>

<div class="sheet">

<form id="signupForm">

    <div class="field-label">Username</div>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Pick a username"
        required
    >

    <div id="usernameStatus" class="status-text"></div>
    <div id="usernameError" class="error-text"></div>

    <div class="field-label">Password</div>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="At least 8 characters"
        required
    >

    <div id="passwordError" class="error-text"></div>

    <div class="field-label">Confirm Password</div>

    <input
        type="password"
        id="confirm"
        name="confirm"
        placeholder="Type it again"
        required
    >

    <div id="confirmError" class="error-text"></div>

    <button
        type="submit"
        id="signupBtn"
        disabled>
        Create Account
    </button>

</form>

    <div class="back">
        <a href="/login" style="text-decoration:none;">
            <button type="button">Back to Login</button>
        </a>
    </div>

</div>

<script src="/static/js/form.js"></script>

<script>

submitForm({
    formId: "signupForm",
    url: "/signup",
    loadingText: "Creating Account..."
});

</script>
<script>
const usernameInput = document.getElementById("username");
const usernameStatus = document.getElementById("usernameStatus");

const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");

const passwordError = document.getElementById("passwordError");
const confirmError = document.getElementById("confirmError");

const signupBtn = document.getElementById("signupBtn");

let usernameValid = false;
let passwordValid = false;
let confirmValid = false;

function updateSignupButton(){

    signupBtn.disabled =
        !(usernameValid && passwordValid && confirmValid);

}

usernameInput.addEventListener("input", async () => {

const username = usernameInput.value.trim();

if (username === "") {

    usernameStatus.textContent = "";
    usernameValid = false;
    updateSignupButton();
    return;

}

if (username.length < 4) {

    usernameStatus.textContent = "Username too short";
    usernameStatus.style.color = "#FF5D5D";
    usernameValid = false;
    updateSignupButton();
    return;

}

    const res = await fetch(
        "/check_username?username=" + encodeURIComponent(username)
    );

    const data = await res.json();

usernameStatus.textContent = data.message;

if (data.available) {

    usernameStatus.style.color = "#00E676";
    usernameValid = true;

} else {

    usernameStatus.style.color = "#FF5D5D";
    usernameValid = false;

}

updateSignupButton();

});

passwordInput.addEventListener("input", () => {

    if (passwordInput.value.length === 0) {

        passwordError.textContent = "";
        passwordValid = false;

    }

    else if (passwordInput.value.length < 8) {

        passwordError.textContent = "Password must be at least 8 characters.";
        passwordValid = false;

    }

    else {

        passwordError.textContent = "";
        passwordValid = true;

    }

    if (confirmInput.value.length > 0) {

        if (passwordInput.value === confirmInput.value) {

            confirmError.textContent = "";
            confirmValid = true;

        } else {

            confirmError.textContent = "Passwords do not match.";
            confirmValid = false;

        }

    }

    updateSignupButton();

});
confirmInput.addEventListener("input", () => {

    if (confirmInput.value.length === 0) {

        confirmError.textContent = "";
        confirmValid = false;

    }

    else if (passwordInput.value !== confirmInput.value) {

        confirmError.textContent = "Passwords do not match.";
        confirmValid = false;

    }

    else {

        confirmError.textContent = "";
        confirmValid = true;

    }

    updateSignupButton();

});

</script>
</body>
</html>
