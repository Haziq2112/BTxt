<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>BText Settings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --void:#0A0E0F;
    --panel:#14181A;
    --panel-2:#1B2023;
    --signal:#00E676;
    --signal-dim:#00E67633;
    --paper:#F5F7F6;
    --slate:#8A9296;
    --coral:#FF5D5D;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
}

body{
    background:var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100dvh;
    padding-bottom:110px;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ---------- HEADER ---------- */

.header{
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    border-bottom:1px solid #1D2225;
}

.header-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
}

/* ---------- PROFILE SUMMARY ---------- */

.profile{
    text-align:center;
    padding:32px 24px;
    border-bottom:1px solid #1D2225;
}

.avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    margin:auto;
    overflow:hidden;
    background:var(--panel-2);
    border:2px solid var(--signal);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.name{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    margin-top:14px;
}

.bio{
    color:var(--slate);
    margin-top:4px;
    font-size:14px;
}

/* ---------- LIST ---------- */

.list-title{
    padding:22px 20px 8px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--slate);
    font-weight:600;
}

.card{
    margin:0 16px;
    background:var(--panel);
    border-radius:16px;
    overflow:hidden;
    border:1px solid #1D2225;
}

.item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 16px;
    font-size:16px;
    border-bottom:1px solid #1D2225;
}

.item:last-child{
    border-bottom:none;
}

.item:active{
    background:var(--panel-2);
}

.icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
}

.item.danger .icon{
    background:#3A1414;
}

.item.danger{
    color:var(--coral);
}

.chev{
    margin-left:auto;
    color:var(--slate);
    font-size:14px;
}

/* ---------- BACK BUTTON ---------- */

.back-wrap{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--void) 60%, transparent);
}

.back{
    width:100%;
    display:block;
    text-align:center;
    padding:16px;
    border-radius:14px;
    background:var(--panel);
    border:1.5px solid #262B2E;
    color:var(--paper);
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.back:active{
    background:var(--panel-2);
}

</style>
</head>

<body>

<div class="header">
    <div class="header-title">⚙ Settings</div>
</div>

<div class="profile">

    <div class="avatar">
        {% if profile_picture %}
            <img src="{{ profile_picture }}">
        {% else %}
            <img src="/static/profile_pictures/default.png">
        {% endif %}
    </div>

    <div class="name">{{ username }}</div>
    <div class="bio">No bio yet</div>

</div>

<div class="list-title">Account</div>

<div class="card">

    <a class="item" href="/profile">
        <div class="icon">👤</div>
        <div>Account</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="/privacy">
        <div class="icon">🔒</div>
        <div>Privacy</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="/chat_settings">
        <div class="icon">💬</div>
        <div>Chats</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="/appearance">
        <div class="icon">🎨</div>
        <div>Appearance</div>
        <div class="chev">›</div>
    </a>

</div>

<div class="list-title">General</div>

<div class="card">

    <a class="item" href="#">
        <div class="icon">🔔</div>
        <div>Notifications</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="#">
        <div class="icon">📱</div>
        <div>Linked Devices</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="#">
        <div class="icon">💾</div>
        <div>Storage &amp; Data</div>
        <div class="chev">›</div>
    </a>

    <a class="item" href="/about">
        <div class="icon">ℹ</div>
        <div>About</div>
        <div class="chev">›</div>
    </a>

</div>

<div class="list-title">&nbsp;</div>

<div class="card">

    <a class="item danger" href="/logout">
        <div class="icon">🚪</div>
        <div>Logout</div>
    </a>

</div>

<div class="back-wrap">
    <a href="/chats">
        <button class="back">← Back</button>
    </a>
</div>

</body>
</html>
